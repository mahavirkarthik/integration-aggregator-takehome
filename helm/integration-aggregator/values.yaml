replicaCount: 1

image:
  repository: integration-aggregator
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

openbao:
  address: http://openbao.integration.svc:8200

secret:
  existingSecret: integration-aggregator-openbao-token

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 20
