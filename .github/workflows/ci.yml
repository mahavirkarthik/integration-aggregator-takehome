name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  helm:
    name: Helm validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint helm/integration-aggregator \
            --set secret.existingSecret=integration-aggregator-openbao-token

      - name: Render Helm chart
        run: |
          helm template integration-aggregator \
            helm/integration-aggregator \
            --set secret.existingSecret=integration-aggregator-openbao-token

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t integration-aggregator:${{ github.sha }} \
            .

  kubernetes:
    name: Kubernetes E2E
    runs-on: ubuntu-latest

    needs:
      - test
      - helm
      - docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Verify cluster
        run: |
          kubectl cluster-info
          minikube status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run full local deployment
        run: |
          make up

      - name: Deploy mock OIDC provider
        run: |
          kubectl apply -f ci/mock-oidc.yaml

          kubectl rollout status \
            deployment/mock-oidc \
            -n integration \
            --timeout=120s

          kubectl get pods -n integration

      - name: Determine OIDC issuer URL
        run: |
          MINIKUBE_IP="$(minikube ip)"

          echo "OIDC_ISSUER_URL=http://${MINIKUBE_IP}:30080/default" \
            >> "$GITHUB_ENV"

      - name: Verify OIDC discovery
        run: |
          curl --fail --silent --show-error \
            "${OIDC_ISSUER_URL}/.well-known/openid-configuration" \
            | jq .

      - name: Port forward application
        run: |
          kubectl port-forward \
            -n integration \
            svc/integration-aggregator \
            8000:8000 \
            > /tmp/port-forward.log 2>&1 &

          for i in $(seq 1 30); do
            if curl --silent --fail \
              http://127.0.0.1:8000/health; then
              exit 0
            fi

            sleep 2
          done

          cat /tmp/port-forward.log
          exit 1

      - name: Run full OAuth E2E smoke test
        env:
          BASE_URL: http://127.0.0.1:8000
        run: |
          ./ci/smoke-test.sh

      - name: Run performance test
        env:
          BASE_URL: http://127.0.0.1:8000
        run: |
          mkdir -p ci-results

          for concurrency in 2 5 10; do
            echo "## Concurrency ${concurrency}" \
              >> ci-results/performance.md

            CONCURRENCY="$concurrency" \
            REQUESTS=30 \
            ./perf/run.sh \
              >> ci-results/performance.md \
              2>&1

            echo >> ci-results/performance.md
          done

      - name: Upload performance artifact
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: ci-results/performance.md

      - name: Show logs on failure
        if: failure()
        run: |
          echo "===== Kubernetes resources ====="
          kubectl get all -n integration

          echo
          echo "===== OpenBao logs ====="
          kubectl logs \
            statefulset/openbao \
            -n integration \
            --all-containers=true \
            --tail=200 || true

          echo
          echo "===== Application logs ====="
          kubectl logs \
            deployment/integration-aggregator \
            -n integration \
            --tail=200 || true

          echo
          echo "===== Mock OIDC logs ====="
          kubectl logs \
            deployment/mock-oidc \
            -n integration \
            --tail=200 || true

          echo
          echo "===== Port-forward log ====="
          cat /tmp/port-forward.log || true

  publish:
    name: Publish artifacts
    runs-on: ubuntu-latest

    needs:
      - kubernetes

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Retry Docker Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" \
            >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.name }}:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package Helm chart
        run: |
          helm package helm/integration-aggregator \
            --version "0.1.${{ github.run_number }}" \
            --app-version "${{ github.sha }}"

      - name: Push Helm chart
        run: |
          helm push \
            integration-aggregator-0.1.${{ github.run_number }}.tgz \
            oci://ghcr.io/${{ steps.image.outputs.name }}/charts
